stages:
  - test
  - integration

variables:
  GIT_DEPTH: "1"
  DC: dmd

# Unit tests run on the self-hosted runner, which already carries a D toolchain
# and needs no MongoDB server.
unittests:
  stage: test
  tags:
    - ogm
  script:
    - PARTS=unittests ./run-ci.sh

# The server version matrix runs on GitLab's shared runners so the self-hosted
# box does not have to host eight MongoDB installations. An explicit tag is
# required here: the ogm runner accepts untagged jobs and would otherwise pick
# these up.
integration:
  stage: integration
  tags:
    - saas-linux-medium-amd64
  image: ubuntu:22.04
  timeout: 60m
  parallel:
    matrix:
      - MONGO: ["3.6", "4.0", "4.2", "4.4", "5.0", "6.0", "7.0", "8.0"]
  variables:
    DEBIAN_FRONTEND: noninteractive
    MONGO_REPO: https://repo.mongodb.org/apt/ubuntu/dists
    MONGOSH: https://downloads.mongodb.com/compass/mongodb-mongosh_2.5.0_amd64.deb
    MONGO_TOOLS: https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.12.0.deb
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends
        ca-certificates curl wget git xz-utils gnupg build-essential libcurl4
    # Servers older than 6.0 were built against OpenSSL 1.1, which jammy dropped.
    # Refresh this URL if the Ubuntu security pool rotates the point release.
    - |
      case "$MONGO" in
        3.6|4.0|4.2|4.4|5.0)
          wget -q http://security.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb
          dpkg -i libssl1.1_*.deb
          ;;
      esac
    # Server and shell builds, mapped per version. Up to 5.0 ships the legacy
    # `mongo` shell; 6.0 and later use mongosh.
    - |
      case "$MONGO" in
        3.6) DIST=bionic; VER=3.6.23; SHELL_URL="$MONGO_REPO/bionic/mongodb-org/3.6/multiverse/binary-amd64/mongodb-org-shell_${VER}_amd64.deb" ;;
        4.0) DIST=bionic; VER=4.0.28; SHELL_URL="$MONGO_REPO/bionic/mongodb-org/4.0/multiverse/binary-amd64/mongodb-org-shell_${VER}_amd64.deb" ;;
        4.2) DIST=bionic; VER=4.2.25; SHELL_URL="$MONGO_REPO/bionic/mongodb-org/4.2/multiverse/binary-amd64/mongodb-org-shell_${VER}_amd64.deb" ;;
        4.4) DIST=focal;  VER=4.4.29; SHELL_URL="$MONGO_REPO/focal/mongodb-org/4.4/multiverse/binary-amd64/mongodb-org-shell_${VER}_amd64.deb" ;;
        5.0) DIST=focal;  VER=5.0.31; SHELL_URL="$MONGO_REPO/focal/mongodb-org/5.0/multiverse/binary-amd64/mongodb-org-shell_${VER}_amd64.deb" ;;
        6.0) DIST=jammy;  VER=6.0.23; SHELL_URL="$MONGOSH" ;;
        7.0) DIST=jammy;  VER=7.0.20; SHELL_URL="$MONGOSH" ;;
        8.0) DIST=jammy;  VER=8.0.9;  SHELL_URL="$MONGOSH" ;;
      esac
      wget -q "$MONGO_REPO/$DIST/mongodb-org/$MONGO/multiverse/binary-amd64/mongodb-org-server_${VER}_amd64.deb"
      wget -q "$SHELL_URL"
      wget -q "$MONGO_TOOLS"
      dpkg -i mongodb-org-server_*.deb mongodb-*shell*.deb mongodb-database-tools-*.deb
      mongod --version
    - curl -fsS https://dlang.org/install.sh -o install.sh
    - bash install.sh -p /opt/dlang install dmd
    - source $(bash install.sh -p /opt/dlang -a dmd)
  script:
    - PARTS=mongo ./run-ci.sh
